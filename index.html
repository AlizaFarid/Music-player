<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Music Player</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f8c8dc, #fce4ec);
            font-family: Arial, sans-serif;
        }

        .player {
            width: 350px;
            padding: 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(180, 100, 130, 0.25);
            backdrop-filter: blur(10px);
        }

        .teenage {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(180, 100, 130, 0.3);
            margin-bottom: 20px;
        }

        h2 {
            margin: 5px 0;
            color: #9b4164;
            font-size: 20px;
        }

        h3 {
            margin: 8px 0 3px;
            color: #54243a;
            font-size: 22px;
        }

        p {
            margin: 0 0 20px;
            color: #9b6b7e;
            font-size: 14px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        button {
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #f3a6c2;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(180, 100, 130, 0.25);
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.1);
            background: #e98fb0;
        }

        #play {
            width: 55px;
            height: 55px;
            background: #d96b99;
            font-size: 22px;
        }

        .progress,
        .volume {
            width: 100%;
            margin-top: 15px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #d96b99;
            cursor: pointer;
        }

        .volume {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .vol-icon {
            font-style: normal;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="player">

        <img src="teenage.jpeg" class="teenage" alt="Album Cover">

        <h2>Now Playing</h2>

        <h3 id="Teenage-Dirtbag">Teenage Dirtbag</h3>

        <p id="Wheatus">Wheatus</p>

        <audio id="audio"></audio>

        <div class="controls">
            <button id="prev">⏮</button>
            <button id="play">▶</button>
            <button id="next">⏭</button>
        </div>

        <div class="progress">
            <input type="range" id="progress" value="0" min="0" max="100">
        </div>

        <div class="volume">
            <i class="vol-icon">🎧</i>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
        </div>

    </div>

</body>
</html>
